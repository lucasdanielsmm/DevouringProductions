<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devouring Lab - Comunidad</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{margin:0;font-family:Segoe UI,Arial;background:#f0f2f5}
.navbar{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:20px}
.logo span{color:#4cc3ff}
.container{display:grid;grid-template-columns:260px 1fr;max-width:1200px;margin:24px auto;gap:24px;padding:0 16px}
.sidebar-left{position:sticky;top:88px}
.nav-item{padding:10px 14px;border-radius:8px;cursor:pointer;margin-bottom:6px;color:#555}
.nav-item.active,.nav-item:hover{background:#e6f7ff;color:#4cc3ff;font-weight:600}
.circles-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.circle-card{background:#fff;border-radius:12px;padding:12px;text-align:center;cursor:pointer;border:1px solid #ddd}
.feed-header{display:flex;background:#fff;border-radius:12px;border:1px solid #ddd;margin-bottom:16px}
.tab-btn{padding:14px 20px;cursor:pointer;font-weight:600;color:#999}
.tab-btn.active{color:#4cc3ff;border-bottom:3px solid #4cc3ff}
.post-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid #ddd}
.post-header{display:flex;justify-content:space-between;font-size:13px;color:#666}
.post-text{margin:10px 0;font-size:14px;line-height:1.6}
.post-footer{display:flex;gap:14px;font-size:13px;color:#999}
.post-footer span{cursor:pointer}
.post-footer span:hover{color:#4cc3ff}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">Devouring<span>Lab</span></div>
</div>

<div class="container">

<aside class="sidebar-left">
  <div class="nav-item active" onclick="changeCategory('all',null)">Inicio</div>
  <div class="nav-item" onclick="changeCategory('following',null)">Siguiendo</div>
</aside>

<main>

<div class="circles-row">
  <div class="circle-card" onclick="changeCategory('section','Taberna')">🍺 Taberna</div>
  <div class="circle-card" onclick="changeCategory('section','Galería')">🎨 Galería</div>
  <div class="circle-card" onclick="changeCategory('section','Lab')">🧪 Lab</div>
  <div class="circle-card" onclick="changeCategory('section','Guías')">📘 Guías</div>
</div>

<div class="feed-header">
  <div class="tab-btn active" id="tabRecientes" onclick="changeSort('recent')">Recientes</div>
  <div class="tab-btn" id="tabTop" onclick="changeSort('top')">Top</div>
</div>

<div id="postsContainer">
  <p style="text-align:center;color:#999">Cargando comunidad…</p>
</div>

</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_vxI4azIIPRyXE3LCAlYDS1xKnwMSYmk",
  authDomain: "devouringlab.firebaseapp.com",
  projectId: "devouringlab",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let appState = {
  filterType: "all",
  filterValue: null,
  sort: "recent",
  unsub: null
};

window.changeCategory = (type,val)=>{
  appState.filterType = type;
  appState.filterValue = val;
  loadFeed();
};

window.changeSort = (s)=>{
  appState.sort = s;
  document.getElementById("tabRecientes").classList.toggle("active",s==="recent");
  document.getElementById("tabTop").classList.toggle("active",s==="top");
  loadFeed();
};

function loadFeed(){
  const cont = document.getElementById("postsContainer");
  cont.innerHTML = `<p style="text-align:center;color:#999">Cargando…</p>`;
  if(appState.unsub) appState.unsub();

  const q = query(collection(db,"posts"), orderBy("timestamp","desc"));

  appState.unsub = onSnapshot(q,snap=>{
    let posts=[];
    snap.forEach(d=>posts.push(d.data()));

    let filtered = posts;

    if(appState.filterType==="section"){
      filtered = posts.filter(p=>p.section===appState.filterValue);
    }

    if(appState.sort==="top"){
      filtered.sort((a,b)=>(b.likes?.length||0)-(a.likes?.length||0));
    }

    render(filtered);
  });
}

function render(posts){
  const cont = document.getElementById("postsContainer");
  if(!posts.length){
    cont.innerHTML=`<p style="text-align:center;color:#999">No hay publicaciones</p>`;
    return;
  }

  cont.innerHTML = posts.map(p=>`
    <div class="post-card">
      <div class="post-header">
        <strong>${p.authorName||"Usuario"}</strong>
        <span>${p.section||"General"}</span>
      </div>
      <div class="post-text">${p.content||""}</div>
      <div class="post-footer">
        <span>❤️ ${(p.likes||[]).length}</span>
        <span>💬 ${(p.comments||[]).length}</span>
      </div>
    </div>
  `).join("");
}

loadFeed();
</script>

</body>
</html>
