<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devouring Lab - Comunidad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ESTILOS REFINADOS --- */
        :root { --bg-body: #f0f2f5; --bg-card: #ffffff; --accent: #4cc3ff; --accent-hover: #3aa8e0; --text-main: #333333; --text-sec: #999999; --border-color: #ebebeb; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        
        /* NAVBAR */
        .navbar { background: var(--bg-card); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid var(--border-color); }
        .logo { font-weight: 800; font-size: 22px; cursor: pointer; }
        .logo span { color: var(--accent); }
        .search-wrapper { position: relative; width: 350px; }
        .search-bar { background: #f4f4f4; border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 10px; width: 100%; }
        
        /* GRID PRINCIPAL */
        .container { display: grid; grid-template-columns: 260px 680px 320px; gap: 24px; max-width: 1300px; margin: 24px auto; padding: 0 20px; }
        
        /* BOTONES Y NAVEGACIÓN */
        .nav-item { display: flex; align-items: center; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; color: #555; margin-bottom: 4px; }
        .nav-item:hover, .nav-item.active { background: #e6f7ff; color: var(--accent); font-weight: bold; }
        .game-nav { position: sticky; top: 64px; z-index: 1000; background: white; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .game-item { padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; border: 1px solid #ddd; }
        .game-item.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* POSTS */
        .post-card { background: white; border-radius: var(--radius); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .post-card.pinned { border: 2px solid #ffd700; background: #fffdf0; }
        .post-header { display: flex; align-items: center; margin-bottom: 15px; }
        .avatar-img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; object-fit: cover; }
        .post-content { margin-bottom: 15px; white-space: pre-wrap; word-wrap: break-word; }
        .post-image { width: 100%; border-radius: 8px; margin-bottom: 15px; max-height: 450px; object-fit: cover; }
        .post-footer { display: flex; gap: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .interaction-btn { cursor: pointer; color: #666; display: flex; align-items: center; gap: 5px; }
        .interaction-btn.liked { color: #ff4c4c; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:3000; align-items:center; justify-content:center; }
        .modal-card { background: white; padding: 25px; border-radius: 16px; width: 500px; max-width: 90%; }
        
        .circle-card { background: white; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #eee; transition: 0.3s; }
        .circle-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .circles-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        
        @media (max-width: 1100px) { .container { grid-template-columns: 1fr; } .sidebar-left, .sidebar-right { display: none; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="location.reload()">Devouring<span>Lab</span></div>
        <div class="search-wrapper">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar en todo...">
            </div>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <button id="openPublishBtn" style="background:var(--accent); color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer;"><i class="fas fa-plus"></i> Publicar</button>
            <img src="https://via.placeholder.com/35" id="navAvatar" style="border-radius:50%; cursor:pointer;">
        </div>
    </nav>

    <div class="game-nav">
        <div class="game-item active" data-game="all">General</div>
        <div class="game-item" data-game="vireo">Vireo CODE</div>
        <div class="game-item" data-game="cae">Cae</div>
        <div class="game-item" data-game="lanzer">Move-Lanzer</div>
        <div class="game-item" data-game="dinoma">Creatura Dinoma</div>
    </div>

    <div class="container">
        <aside class="sidebar-left">
            <div class="nav-item active" id="btn-inicio"><i class="fas fa-home" style="margin-right:10px"></i> Inicio</div>
            <div class="nav-item" id="btn-seguidores"><i class="fas fa-user-friends" style="margin-right:10px"></i> Siguiendo</div>
        </aside>

        <main>
            <div class="circles-row">
                <div class="circle-card" data-section="Taberna"><i class="fas fa-mug-hot"></i><br>Taberna</div>
                <div class="circle-card" data-section="Galería"><i class="fas fa-paint-brush"></i><br>Galería</div>
                <div class="circle-card" data-section="Lab"><i class="fas fa-flask"></i><br>Lab</div>
                <div class="circle-card" data-section="Guías"><i class="fas fa-book"></i><br>Guías</div>
            </div>

            <div style="background:white; display:flex; border-radius:12px; margin-bottom:15px; border:1px solid #eee;">
                <div id="sort-recent" style="flex:1; text-align:center; padding:12px; cursor:pointer; font-weight:bold; border-bottom:3px solid var(--accent);">Recientes</div>
                <div id="sort-top" style="flex:1; text-align:center; padding:12px; cursor:pointer; color:#999;">Top Likes</div>
            </div>

            <div id="postsContainer"></div>
        </main>

        <aside class="sidebar-right">
            <div id="authBox" style="background:white; padding:20px; border-radius:12px; text-align:center; border:1px solid #eee;">
                <p>Únete a la comunidad</p>
                <button id="loginBtn" style="background:#4285F4; color:white; border:none; padding:10px 20px; border-radius:8px; margin-top:10px; cursor:pointer;">Google Login</button>
            </div>
            <div id="userBox" style="display:none; background:white; padding:20px; border-radius:12px; border:1px solid #eee;">
                <h3 id="userName">Cargando...</h3>
                <button onclick="auth.signOut()" style="color:red; background:none; border:none; cursor:pointer; font-size:12px;">Cerrar Sesión</button>
            </div>
        </aside>
    </div>

    <div class="modal-overlay" id="modalPublish">
        <div class="modal-card">
            <h3>Nueva Publicación</h3><br>
            <select id="postGame" style="width:100%; padding:10px; margin-bottom:10px;">
                <option value="all">General</option>
                <option value="vireo">Vireo CODE</option>
                <option value="cae">Cae</option>
                <option value="lanzer">Move-Lanzer</option>
                <option value="dinoma">Creatura Dinoma</option>
            </select>
            <select id="postSection" style="width:100%; padding:10px; margin-bottom:10px;">
                <option value="Taberna">Taberna</option>
                <option value="Galería">Galería</option>
                <option value="Lab">Lab</option>
                <option value="Guías">Guías</option>
            </select>
            <textarea id="postContent" placeholder="¿Qué estás pensando? Usa #hashtags" style="width:100%; height:100px; padding:10px;"></textarea>
            <input type="file" id="fileInput" style="margin-top:10px;">
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                <button onclick="document.getElementById('modalPublish').style.display='none'">Cancelar</button>
                <button id="submitPost" style="background:var(--accent); color:white; border:none; padding:8px 20px; border-radius:8px;">Publicar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_vxI4azIIPRyXE3LCAlYDS1xKnwMSYmk",
            authDomain: "devouringlab.firebaseapp.com",
            projectId: "devouringlab",
            storageBucket: "devouringlab.firebasestorage.app",
            messagingSenderId: "383272939740",
            appId: "1:383272939740:web:203f83c89b1c7bd6344419"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let appState = { 
            type: 'all', // all, game, section, following, search
            value: null,
            sort: 'recent' 
        };

        /* ================= LÓGICA DE CARGA Y FILTRADO ================= */
        const loadFeed = () => {
            const feedDiv = document.getElementById('postsContainer');
            feedDiv.innerHTML = "<p style='text-align:center; padding:20px;'>Cargando posts...</p>";

            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"), limit(100));

            onSnapshot(q, (snapshot) => {
                let posts = [];
                snapshot.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));

                const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

                // FILTRADO MAESTRO
                let filtered = posts;

                if (searchTerm !== "") {
                    // Si el buscador tiene algo, manda el buscador sobre todo
                    filtered = posts.filter(p => 
                        (p.content && p.content.toLowerCase().includes(searchTerm)) ||
                        (p.authorName && p.authorName.toLowerCase().includes(searchTerm))
                    );
                } else {
                    // Si no hay búsqueda, aplicamos filtros de pestañas
                    if (appState.type === 'game') {
                        filtered = posts.filter(p => p.game === appState.value);
                    } else if (appState.type === 'section') {
                        filtered = posts.filter(p => p.section === appState.value);
                    }
                    // Si es 'all' (inicio), se queda la lista completa
                }

                // ORDENAR POR TOP LIKES SI TOCA
                if (appState.sort === 'top') {
                    filtered.sort((a,b) => (b.likes?.length || 0) - (a.likes?.length || 0));
                } else {
                    // Poner fijados arriba
                    filtered.sort((a,b) => (b.isPinned === true) - (a.isPinned === true));
                }

                renderPosts(filtered);
            });
        };

        const renderPosts = (posts) => {
            const feedDiv = document.getElementById('postsContainer');
            feedDiv.innerHTML = "";
            
            if (posts.length === 0) {
                feedDiv.innerHTML = "<p style='text-align:center; color:#999; padding:20px;'>No se encontró nada.</p>";
                return;
            }

            posts.forEach(p => {
                const isLiked = currentUser && (p.likes || []).includes(currentUser.uid);
                const postDate = p.timestamp ? p.timestamp.toDate().toLocaleDateString() : "Reciente";
                
                const card = document.createElement('div');
                card.className = `post-card ${p.isPinned ? 'pinned' : ''}`;
                card.innerHTML = `
                    <div class="post-header">
                        <img src="${p.authorAvatar}" class="avatar-img">
                        <div>
                            <b>${p.authorName}</b> <span style="font-size:11px; color:#999">@${postDate}</span><br>
                            <span style="font-size:11px; background:#eee; padding:2px 6px; border-radius:4px;">${p.game} | ${p.section}</span>
                        </div>
                    </div>
                    <div class="post-content">${p.content.replace(/#(\w+)/g, '<span style="color:#4cc3ff">#$1</span>')}</div>
                    ${p.image ? `<img src="${p.image}" class="post-image">` : ''}
                    <div class="post-footer">
                        <div class="interaction-btn ${isLiked ? 'liked' : ''}" onclick="window.handleLike('${p.id}', ${isLiked})">
                            <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> ${p.likes?.length || 0}
                        </div>
                        <div class="interaction-btn"><i class="far fa-comment"></i> Comentar</div>
                    </div>
                `;
                feedDiv.appendChild(card);
            });
        };

        /* ================= EVENTOS DE INTERFAZ ================= */
        
        // Botones de Juegos
        document.querySelectorAll('.game-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.game-item, .nav-item').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                appState.type = btn.dataset.game === 'all' ? 'all' : 'game';
                appState.value = btn.dataset.game;
                document.getElementById('searchInput').value = ""; // Limpiar buscador al cambiar
                loadFeed();
            });
        });

        // Botones de Secciones (Taberna, Galería, etc)
        document.querySelectorAll('.circle-card').forEach(btn => {
            btn.addEventListener('click', () => {
                appState.type = 'section';
                appState.value = btn.dataset.section;
                document.getElementById('searchInput').value = "";
                loadFeed();
            });
        });

        // Buscador
        document.getElementById('searchInput').addEventListener('input', () => {
            // No cambiamos appState.type aquí para que cuando borre la búsqueda vuelva a donde estaba
            loadFeed();
        });

        // Inicio
        document.getElementById('btn-inicio').addEventListener('click', () => {
            appState.type = 'all';
            document.querySelectorAll('.active').forEach(e => e.classList.remove('active'));
            document.getElementById('btn-inicio').classList.add('active');
            document.getElementById('searchInput').value = "";
            loadFeed();
        });

        // Sort
        document.getElementById('sort-recent').addEventListener('click', () => {
            appState.sort = 'recent';
            document.getElementById('sort-recent').style.borderBottom = "3px solid var(--accent)";
            document.getElementById('sort-top').style.borderBottom = "none";
            loadFeed();
        });
        document.getElementById('sort-top').addEventListener('click', () => {
            appState.sort = 'top';
            document.getElementById('sort-top').style.borderBottom = "3px solid var(--accent)";
            document.getElementById('sort-recent').style.borderBottom = "none";
            loadFeed();
        });

        /* ================= LOGIN Y PUBLICAR ================= */
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('userBox').style.display = 'block';
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('navAvatar').src = user.photoURL;
            } else {
                document.getElementById('authBox').style.display = 'block';
                document.getElementById('userBox').style.display = 'none';
                document.getElementById('navAvatar').src = "https://via.placeholder.com/35";
            }
            loadFeed();
        });

        document.getElementById('loginBtn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('openPublishBtn').addEventListener('click', () => {
            if(!currentUser) return alert("Inicia sesión primero");
            document.getElementById('modalPublish').style.display = 'flex';
        });

        window.handleLike = async (postId, isLiked) => {
            if(!currentUser) return alert("Inicia sesión para dar like");
            const ref = doc(db, "posts", postId);
            await updateDoc(ref, {
                likes: isLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
            });
        };

        document.getElementById('submitPost').addEventListener('click', async () => {
            const content = document.getElementById('postContent').value;
            if(!content) return alert("Escribe algo");
            
            const btn = document.getElementById('submitPost');
            btn.disabled = true;
            btn.innerText = "Subiendo...";

            let imageUrl = "";
            const file = document.getElementById('fileInput').files[0];
            if(file) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', "DevouringIMG");
                const res = await fetch(`https://api.cloudinary.com/v1_1/dyhvx2vsz/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                imageUrl = data.secure_url;
            }

            await addDoc(collection(db, "posts"), {
                authorUid: currentUser.uid,
                authorName: currentUser.displayName,
                authorAvatar: currentUser.photoURL,
                content: content,
                game: document.getElementById('postGame').value,
                section: document.getElementById('postSection').value,
                image: imageUrl,
                likes: [],
                timestamp: serverTimestamp()
            });

            document.getElementById('modalPublish').style.display = 'none';
            document.getElementById('postContent').value = "";
            btn.disabled = false;
            btn.innerText = "Publicar";
        });

    </script>
</body>
</html>
