<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Devouring Lab - Comunidad</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
        import {
            getFirestore, collection, addDoc, query, orderBy, limit,
            onSnapshot, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove
        } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";
        import {
            getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";

        /* ================= CONFIG ================= */

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "devouringlab.firebaseapp.com",
            projectId: "devouringlab",
            storageBucket: "devouringlab.appspot.com",
            messagingSenderId: "383272939740",
            appId: "1:383272939740:web:203f83c89b1c7bd6344419"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        /* ================= ESTADO GLOBAL ================= */

        const appState = {
            filterType: "all",
            filterValue: null,
            sort: "recent",
            unsubscribe: null
        };

        /* ================= AUTENTICACIÓN ================= */

        onAuthStateChanged(auth, user => {
            currentUser = user;
            loadFeed();
        });

        /* ================= FILTROS ================= */

        window.changeCategory = (type, value) => {
            appState.filterType = type;
            appState.filterValue = value;
            loadFeed();
        };

        window.changeSort = (mode) => {
            appState.sort = mode;
            loadFeed();
        };

        /* ================= FEED (ARREGLADO) ================= */

        function loadFeed() {
            const container = document.getElementById("postsContainer");
            container.innerHTML = `<p style="text-align:center;color:#999;padding:20px">Cargando…</p>`;

            if (appState.unsubscribe) appState.unsubscribe();

            const q = query(
                collection(db, "posts"),
                orderBy("timestamp", "desc"),
                limit(100)
            );

            appState.unsubscribe = onSnapshot(q, snap => {
                let posts = [];
                snap.forEach(d => posts.push({ id: d.id, ...d.data() }));

                /* ===== FILTRADO CORRECTO ===== */
                let filtered = posts;

                if (appState.filterType === "section" && appState.filterValue) {
                    filtered = posts.filter(p => p.section === appState.filterValue);
                }

                if (appState.filterType === "game" && appState.filterValue) {
                    filtered = filtered.filter(p => p.game === appState.filterValue);
                }

                if (appState.sort === "top") {
                    filtered.sort((a, b) =>
                        (b.likes?.length || 0) - (a.likes?.length || 0)
                    );
                }

                renderPosts(filtered);
            });
        }

        /* ================= RENDER ================= */

        function renderPosts(posts) {
            const container = document.getElementById("postsContainer");

            if (posts.length === 0) {
                container.innerHTML = `<p style="text-align:center;color:#999;padding:30px">
                    No hay publicaciones aquí.
                </p>`;
                return;
            }

            container.innerHTML = posts.map(post => {
                const liked = currentUser && post.likes?.includes(currentUser.uid);

                return `
                    <article class="post-card">
                        <div class="post-header">
                            <strong>${post.authorName || "Usuario"}</strong>
                            <span style="color:#999;font-size:12px">
                                ${post.section || "General"} · ${post.game || ""}
                            </span>
                        </div>

                        <div class="post-content">${post.content || ""}</div>

                        ${post.image ? `<img src="${post.image}" class="post-img">` : ""}

                        <div class="post-actions">
                            <button onclick="toggleLike('${post.id}', ${liked})">
                                <i class="fa-heart ${liked ? "fas" : "far"}"></i>
                                ${(post.likes || []).length}
                            </button>
                        </div>
                    </article>
                `;
            }).join("");
        }

        /* ================= LIKES ================= */

        window.toggleLike = async (id, liked) => {
            if (!currentUser) {
                signInWithPopup(auth, provider);
                return;
            }
            const ref = doc(db, "posts", id);
            await updateDoc(ref, {
                likes: liked
                    ? arrayRemove(currentUser.uid)
                    : arrayUnion(currentUser.uid)
            });
        };
    </script>

    <style>
        body { font-family: Arial, sans-serif; background:#f0f2f5; margin:0 }
        main { max-width:700px; margin:auto; padding:20px }
        .post-card { background:white; border-radius:10px; padding:15px; margin-bottom:15px }
        .post-header { display:flex; justify-content:space-between; margin-bottom:8px }
        .post-img { width:100%; border-radius:8px; margin-top:10px }
        .post-actions button { background:none; border:none; cursor:pointer }
    </style>
</head>

<body>
    <main>
        <div style="margin-bottom:20px">
            <button onclick="changeCategory('all')">Comunidad</button>
            <button onclick="changeCategory('section','Taberna')">Taberna</button>
            <button onclick="changeCategory('section','Galería')">Galería</button>
            <button onclick="changeCategory('section','Lab')">Lab</button>
        </div>

        <div id="postsContainer">
            <p style="text-align:center;color:#999">Cargando comunidad…</p>
        </div>
    </main>
</body>
</html>
